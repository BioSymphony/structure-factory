<svg xmlns="http://www.w3.org/2000/svg" width="560" height="568" viewBox="0 0 560 568" role="img" aria-labelledby="title desc">
<title id="title">Tool Knowledge, Calls, And Chains</title>
<desc id="desc">Tool cards and source references inform tool selection. The agent and CLI bind configured commands. Adapters connect checked outputs between stages. Scientific outputs include structures, scores, candidate rankings, and figures.</desc>
