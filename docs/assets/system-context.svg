    <rect x="14.5" y="230.5" width="431" height="91" rx="11"/>
  </g>
  <g fill="none" stroke="#6adce5" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">
    <path d="M42 108v12m-4-4 4 4 4-4"/>
    <path d="M42 216v12m-4-4 4 4 4-4"/>
  </g>

  <g fill="#101c2d" stroke="#51748f">
    <rect x="26.5" y="44.5" width="31" height="31" rx="7"/>
    <rect x="26.5" y="152.5" width="31" height="31" rx="7"/>
    <rect x="26.5" y="260.5" width="31" height="31" rx="7"/>
  </g>
  <g fill="none" stroke="#6adce5" stroke-width="1.65" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
