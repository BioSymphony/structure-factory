<svg xmlns="http://www.w3.org/2000/svg" width="460" height="336" viewBox="0 0 460 336" role="img" aria-labelledby="title desc">
  <title id="title">A structure prediction and review workflow</title>
  <desc id="desc">Prepare Boltz YAML from the public 1UBQ sequence. Predict with Boltz and check the model and confidence JSON. Compare the model to 1UBQ and report aligned residues, RMSD, and confidence.</desc>

