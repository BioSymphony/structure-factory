<svg xmlns="http://www.w3.org/2000/svg" width="520" height="640" viewBox="0 0 520 640" role="img" aria-labelledby="title desc">
  <title id="title">Compare design methods in one computational experiment</title>
  <desc id="desc">Define a common target, controls, quota, and budget. Run RFdiffusion3 with ProteinMPNN sequence completion where needed, alongside separate BoltzGen and BindCraft2 arms. Evaluate candidates with a shared Boltz and Chai panel. Compare interface scores, site geometry, and diversity to select candidates and plan the next experiment.</desc>
  <defs>
    <marker id="arrow" viewBox="0 0 8 8" refX="6" refY="4" markerWidth="7" markerHeight="7" orient="auto">
      <path d="M1 1 6 4 1 7" fill="none" stroke="#6adce5" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/>
    </marker>
  </defs>
  <rect x="0.5" y="0.5" width="519" height="639" rx="18" fill="#101c2d" stroke="#486680"/>

  <g fill="none" stroke="#6adce5" stroke-width="2" marker-end="url(#arrow)">
    <path d="M260 104v18H136v18"/>
    <path d="M260 122h124v18"/>
    <path d="M136 280v20h124v22"/>
    <path d="M384 280v20H260" marker-end="none"/>
    <path d="M260 414v28"/>
    <path d="M260 534v28"/>
  </g>

  <g stroke="#486680" fill="#192b42">
    <rect x="16.5" y="16.5" width="487" height="87" rx="11"/>
    <rect x="16.5" y="146.5" width="239" height="133" rx="11"/>
    <rect x="264.5" y="146.5" width="239" height="133" rx="11"/>
    <rect x="16.5" y="328.5" width="487" height="85" rx="11"/>
    <rect x="16.5" y="448.5" width="487" height="85" rx="11"/>
    <rect x="16.5" y="568.5" width="487" height="55" rx="11" fill="#183b46" stroke="#50979d"/>
  </g>

  <g font-family="Inter, Arial, sans-serif" text-anchor="middle">
    <g fill="#f5f8fc" font-size="24" font-weight="700">
      <text x="260" y="51">Define the experiment</text>
      <text x="136" y="181">RFdiffusion3</text>
      <text x="384" y="181">BoltzGen</text>
      <text x="384" y="213">BindCraft2</text>
      <text x="260" y="363">Shared Boltz + Chai assessment</text>
      <text x="260" y="483">Compare evidence</text>
    </g>
    <g fill="#c7d9e9" font-size="21">
      <text x="260" y="82">Target, controls, quota, budget</text>
      <text x="136" y="213">ProteinMPNN</text>
      <text x="136" y="252">Design sequences</text>
      <text x="384" y="252">Separate design arms</text>
      <text x="260" y="395">Structures + confidence matrices</text>
      <text x="260" y="515">Interface, site geometry, diversity</text>
    </g>
    <text x="260" y="603" fill="#f5f8fc" font-size="22" font-weight="600">Select candidates + next experiment</text>
  </g>
</svg>
