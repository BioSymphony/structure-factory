  <g font-family="Inter, Arial, sans-serif">
    <g fill="#f5f8fc" font-size="24" font-weight="700">
      <text x="75" y="53">Prepare the input</text>
      <text x="75" y="161">Predict with Boltz</text>
      <text x="75" y="269">Compare to PDB 1UBQ</text>
