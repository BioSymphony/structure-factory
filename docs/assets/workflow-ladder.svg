<svg xmlns="http://www.w3.org/2000/svg" width="560" height="644" viewBox="0 0 560 644" role="img" aria-labelledby="title desc">
<title id="title">An Example Scientific Toolchain</title>
<desc id="desc">Prepare inputs, generate candidates with selected design tools, predict structures, score and filter the outputs, and review candidate rankings and figures. Configure tool calls for the selected stages; the arrows represent file handoffs.</desc>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M1 1 L9 5 L1 9" fill="none" stroke="#425b70" stroke-width="1.5"/></marker></defs>
<rect width="560" height="644" rx="16" fill="#ffffff"/>
<g font-family="Arial, Helvetica, sans-serif">
<rect x="20" y="16" width="520" height="96" rx="12" fill="#e9f7f8" stroke="#aebfce" stroke-width="1.5"/>
<text x="40" y="52" font-size="25" fill="#087e8b">1. Prepare Inputs</text>
<text x="40" y="90" font-size="21" fill="#425b70">Target definition and selected input files</text>
<path d="M280 116 l0 20" fill="none" stroke="#425b70" stroke-width="2" marker-end="url(#arrow)"/>
<rect x="20" y="142" width="520" height="96" rx="12" fill="#e9f7f8" stroke="#aebfce" stroke-width="1.5"/>
<text x="40" y="178" font-size="25" fill="#087e8b">2. Generate Candidates</text>
<text x="40" y="216" font-size="21" fill="#425b70">Selected generation and sequence-design tools</text>
<path d="M280 242 l0 20" fill="none" stroke="#425b70" stroke-width="2" marker-end="url(#arrow)"/>
<rect x="20" y="268" width="520" height="96" rx="12" fill="#e9f7f8" stroke="#aebfce" stroke-width="1.5"/>
<text x="40" y="304" font-size="25" fill="#087e8b">3. Predict Structures</text>
<text x="40" y="342" font-size="21" fill="#425b70">Selected cofold or structure-prediction models</text>
<path d="M280 368 l0 20" fill="none" stroke="#425b70" stroke-width="2" marker-end="url(#arrow)"/>
<rect x="20" y="394" width="520" height="96" rx="12" fill="#e9f7f8" stroke="#aebfce" stroke-width="1.5"/>
<text x="40" y="430" font-size="25" fill="#087e8b">4. Score And Filter</text>
<text x="40" y="468" font-size="21" fill="#425b70">Declared metrics, filters, and failure rows</text>
<path d="M280 494 l0 20" fill="none" stroke="#425b70" stroke-width="2" marker-end="url(#arrow)"/>
<rect x="20" y="520" width="520" height="96" rx="12" fill="#f0f5fc" stroke="#aebfce" stroke-width="1.5"/>
<text x="40" y="556" font-size="25" fill="#2563a6">5. Review Candidates</text>
<text x="40" y="594" font-size="21" fill="#425b70">Candidate rankings and structural figures</text>
</g>
</svg>
